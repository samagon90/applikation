# Готовый workflow для GitHub Actions (автосборка APK при пуше).
#
# ВАЖНО: скопируйте этот файл в репозиторий как
#   .github/workflows/build-apk.yml
# (песочница Arena не может пушить файлы в .github/workflows напрямую,
# поэтому шаблон лежит здесь — добавьте его через веб-интерфейс GitHub
# или со своей машины: Actions -> New workflow -> вставить содержимое).
name: Build APK

on:
  push:
    branches:
      - arena/019fff2d-applikation
  workflow_dispatch:

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ArenaAI-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaAI-release
          path: ArenaAI-release.apk
          retention-days: 90
